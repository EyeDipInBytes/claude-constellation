<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="dark">
<title>Constellation</title>
<style>:root {
  --bg: #04050a;
  --panel: rgba(14, 16, 26, 0.68);
  --panel-strong: rgba(18, 20, 32, 0.9);
  --line: rgba(255, 255, 255, 0.075);
  --line-strong: rgba(255, 255, 255, 0.16);
  --text: #e8eaf1;
  --muted: #9097a8;
  --faint: #5d6476;
  --accent: #b39bff;
  --radius: 14px;
  --font: ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  color: var(--text);
  font: 13px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  background:
    radial-gradient(1100px 760px at 50% 46%, #101429 0%, rgba(10, 12, 24, 0.6) 45%, rgba(4, 5, 10, 0) 75%),
    radial-gradient(900px 600px at 85% 110%, rgba(110, 70, 190, 0.12), transparent 70%),
    radial-gradient(700px 500px at 0% 0%, rgba(40, 120, 190, 0.08), transparent 70%),
    linear-gradient(118deg, transparent 28%, rgba(120, 110, 210, 0.045) 44%, rgba(150, 170, 255, 0.06) 50%, rgba(110, 90, 200, 0.04) 56%, transparent 72%),
    var(--bg);
}

canvas#sky {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  display: block;
  cursor: grab;
  touch-action: none;
}
canvas#sky.dragging { cursor: grabbing; }
canvas#sky.over-node { cursor: pointer; }

.glass {
  background: var(--panel);
  -webkit-backdrop-filter: blur(18px) saturate(150%);
  backdrop-filter: blur(18px) saturate(150%);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 12px 40px rgba(0, 0, 0, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.04);
}

button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  cursor: pointer;
}
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

kbd {
  font: 600 10px/1 var(--mono);
  color: var(--muted);
  padding: 3px 6px;
  border: 1px solid var(--line-strong);
  border-bottom-width: 2px;
  border-radius: 5px;
}

/* ---------- brand ---------- */
.brand {
  position: fixed;
  top: 16px;
  left: 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 14px 9px 10px;
  max-width: calc(100vw - 32px);
  z-index: 3;
}
.mark { width: 28px; height: 28px; flex: none; filter: drop-shadow(0 0 6px rgba(179, 155, 255, 0.6)); }
.brand h1 { margin: 0; font-size: 14px; font-weight: 650; letter-spacing: 0.01em; }
.brand p { margin: 1px 0 0; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ---------- search ---------- */
.search {
  position: fixed;
  top: 16px;
  left: 50%;
  transform: translateX(-50%);
  width: min(460px, calc(100vw - 32px));
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 0 10px 0 12px;
  height: 44px;
  border-radius: 999px;
  z-index: 4;
}
.search > svg { width: 16px; height: 16px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; flex: none; }
.search input {
  flex: 1;
  min-width: 0;
  height: 100%;
  background: none;
  border: 0;
  outline: none;
  color: var(--text);
  font: 14px var(--font);
}
.search input::placeholder { color: var(--faint); }
#results {
  position: absolute;
  top: 52px;
  left: 0;
  right: 0;
  margin: 0;
  padding: 6px;
  list-style: none;
  max-height: min(60vh, 420px);
  overflow: auto;
  background: var(--panel-strong);
}
#results li {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 9px;
  cursor: pointer;
}
#results li[aria-selected="true"], #results li:hover { background: rgba(255, 255, 255, 0.06); }
#results .r-label { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#results .r-type { color: var(--faint); font-size: 11px; white-space: nowrap; }
#results .none { color: var(--muted); cursor: default; }

.dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  flex: none;
  background: var(--c);
  box-shadow: 0 0 8px var(--c);
}

/* ---------- toolbar ---------- */
.toolbar {
  position: fixed;
  top: 16px;
  right: 16px;
  display: flex;
  padding: 4px;
  gap: 2px;
  z-index: 4;
}
.toolbar button {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  display: grid;
  place-items: center;
  color: var(--muted);
  transition: background 0.15s, color 0.15s;
}
.toolbar button:hover, .toolbar button[aria-expanded="true"], .toolbar button.on { background: rgba(255, 255, 255, 0.07); color: var(--text); }
.toolbar svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- settings ---------- */
#settings {
  position: fixed;
  top: 68px;
  right: 16px;
  width: 270px;
  padding: 14px 16px 16px;
  z-index: 5;
  max-height: calc(100vh - 90px);
  overflow: auto;
}
#settings h3 {
  margin: 4px 0 10px;
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faint);
}
#settings h3:not(:first-child) { margin-top: 16px; }
.slider { display: grid; grid-template-columns: 1fr auto; gap: 4px 8px; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
.slider output { grid-row: 1; grid-column: 2; font: 11px var(--mono); color: var(--text); text-align: right; }
.slider input { grid-column: 1 / -1; width: 100%; accent-color: var(--accent); margin: 0; }
.switch { display: flex; align-items: center; gap: 10px; padding: 5px 0; cursor: pointer; color: var(--text); font-size: 12.5px; }
.switch input { position: absolute; opacity: 0; pointer-events: none; }
.switch i {
  width: 28px;
  height: 16px;
  border-radius: 99px;
  background: rgba(255, 255, 255, 0.12);
  position: relative;
  transition: background 0.15s;
  flex: none;
}
.switch i::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: #c9cedb;
  transition: transform 0.15s;
}
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(12px); background: #fff; }
.switch input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 2px; }
.row-buttons { display: flex; gap: 8px; margin-top: 14px; }
.row-buttons button {
  flex: 1;
  padding: 7px 0;
  border-radius: 9px;
  border: 1px solid var(--line-strong);
  color: var(--muted);
  font-size: 12px;
}
.row-buttons button:hover { color: var(--text); background: rgba(255, 255, 255, 0.05); }

/* ---------- legend ---------- */
#legend {
  position: fixed;
  left: 16px;
  bottom: 16px;
  padding: 10px 8px 8px;
  width: 210px;
  max-height: calc(100vh - 110px);
  overflow: auto;
  z-index: 3;
}
#legend h3 {
  margin: 0 8px 6px;
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faint);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#legend h3 button { font-size: 10.5px; letter-spacing: 0.04em; text-transform: none; color: var(--accent); font-weight: 600; }
#legend ul { list-style: none; margin: 0; padding: 0; }
#legend li button {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 5px 8px;
  border-radius: 8px;
  text-align: left;
  font-size: 12.5px;
  transition: opacity 0.15s, background 0.15s;
}
#legend li button:hover { background: rgba(255, 255, 255, 0.05); }
#legend li button.off { opacity: 0.35; }
#legend li button.off .dot { box-shadow: none; }
#legend .l-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#legend .l-count { color: var(--faint); font: 11px var(--mono); font-variant-numeric: tabular-nums; }
#legend .toggle-legend { display: none; }

/* ---------- panel ---------- */
#panel {
  position: fixed;
  top: 76px;
  right: 16px;
  bottom: 16px;
  width: 380px;
  max-width: calc(100vw - 32px);
  overflow: auto;
  padding: 18px 18px 22px;
  z-index: 3;
  animation: panel-in 0.22s ease-out;
}
@keyframes panel-in { from { opacity: 0; transform: translateX(12px); } to { opacity: 1; transform: none; } }
#panel .close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 30px;
  height: 30px;
  border-radius: 8px;
  color: var(--muted);
  font-size: 18px;
  line-height: 1;
}
#panel .close:hover { background: rgba(255, 255, 255, 0.07); color: var(--text); }
.chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 3px 10px 3px 8px;
  border-radius: 99px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: var(--c);
  background: color-mix(in srgb, var(--c) 13%, transparent);
  border: 1px solid color-mix(in srgb, var(--c) 28%, transparent);
}
.chip .dot { width: 7px; height: 7px; }
#panel h2 {
  margin: 12px 34px 6px 0;
  font-size: 19px;
  line-height: 1.25;
  font-weight: 650;
  letter-spacing: -0.01em;
  word-break: break-word;
}
#panel .path {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  margin: 0 0 12px;
}
#panel .path code {
  flex: 1;
  min-width: 0;
  font: 11px/1.5 var(--mono);
  color: var(--muted);
  word-break: break-all;
}
#panel .path button { color: var(--faint); font-size: 11px; padding: 0 2px; white-space: nowrap; }
#panel .path button:hover { color: var(--text); }
#panel .desc { margin: 0 0 14px; color: #c9cdd8; font-size: 13px; }
#panel dl {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 5px 14px;
  margin: 0 0 16px;
  padding: 10px 12px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--line);
  font-size: 12px;
}
#panel dt { color: var(--faint); white-space: nowrap; }
#panel dd { margin: 0; color: var(--text); word-break: break-word; font-variant-numeric: tabular-nums; }
#panel h4 {
  margin: 18px 0 8px;
  font-size: 10.5px;
  font-weight: 650;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--faint);
}
.seg {
  display: inline-flex;
  padding: 3px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--line);
}
.seg button { padding: 5px 11px; border-radius: 7px; font-size: 12px; color: var(--muted); }
.seg button.on { background: rgba(255, 255, 255, 0.1); color: var(--text); }
.conn { display: flex; flex-wrap: wrap; gap: 6px; }
.conn button {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  max-width: 100%;
  padding: 4px 9px 4px 7px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.04);
  border: 1px solid var(--line);
  font-size: 12px;
  transition: background 0.12s, border-color 0.12s;
}
.conn button:hover { background: rgba(255, 255, 255, 0.08); border-color: var(--line-strong); }
.conn button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.conn button em { font-style: normal; color: var(--faint); font-size: 10.5px; }
.conn .dot { width: 7px; height: 7px; }
.conn .more { color: var(--faint); font-size: 12px; padding: 4px 6px; }

.md {
  font-size: 12.5px;
  line-height: 1.6;
  color: #c4c9d6;
  padding: 12px 14px;
  border-radius: 10px;
  background: rgba(0, 0, 0, 0.22);
  border: 1px solid var(--line);
  overflow-wrap: anywhere;
}
.md h5 { margin: 12px 0 4px; font-size: 13px; color: var(--text); font-weight: 650; }
.md h5:first-child { margin-top: 0; }
.md p { margin: 0 0 8px; }
.md ul { margin: 0 0 8px; padding-left: 18px; }
.md li { margin: 2px 0; }
.md code { font: 11.5px var(--mono); color: #e2c8ff; background: rgba(179, 155, 255, 0.09); padding: 1px 4px; border-radius: 4px; }
.md pre { margin: 0 0 8px; padding: 8px 10px; border-radius: 8px; background: rgba(0, 0, 0, 0.3); overflow: auto; font: 11px/1.5 var(--mono); color: #b9c0d0; }
.md strong { color: var(--text); }
.md .wl { color: #c9b6ff; border-bottom: 1px dashed rgba(201, 182, 255, 0.5); cursor: pointer; }
.md .wl.missing { color: #8a90a0; border-bottom-color: rgba(138, 144, 160, 0.5); cursor: default; }
.md .ml { color: #8fd3ff; }
.note { color: var(--faint); font-size: 11.5px; margin-top: 8px; }

/* ---------- timeline ---------- */
#timeline {
  position: fixed;
  left: 50%;
  bottom: 28px;
  transform: translateX(-50%);
  padding: 12px 20px 14px;
  min-width: 240px;
  text-align: center;
  z-index: 3;
}
#time-label { font-size: 20px; font-weight: 650; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
#timeline .bar { margin-top: 8px; height: 3px; border-radius: 3px; background: rgba(255, 255, 255, 0.08); overflow: hidden; }
#timeline .bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #6cc6ff, #b39bff, #ff8fb1); }

/* ---------- hover card ---------- */
#tip {
  position: fixed;
  left: 0;
  top: 0;
  z-index: 6;
  max-width: 290px;
  padding: 9px 12px 10px;
  border-radius: 11px;
  pointer-events: none;
  background: var(--panel-strong);
  will-change: transform;
}
#tip .tip-type { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--c); }
#tip .tip-type .dot { width: 6px; height: 6px; }
#tip .tip-label { margin-top: 3px; font-size: 13.5px; font-weight: 650; color: var(--text); word-break: break-word; }
#tip .tip-desc {
  margin-top: 4px;
  font-size: 12px;
  color: #b9bfcc;
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
#tip .tip-meta { margin-top: 6px; font-size: 11px; color: var(--faint); }

/* ---------- hint + empty ---------- */
#hint {
  position: fixed;
  left: 50%;
  bottom: 22px;
  transform: translateX(-50%);
  color: var(--faint);
  font-size: 12px;
  white-space: nowrap;
  pointer-events: none;
  transition: opacity 1.2s;
  z-index: 2;
}
#hint.gone { opacity: 0; }
#hint kbd { font-size: 9.5px; padding: 2px 5px; }
#empty {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
  color: var(--muted);
  font-size: 15px;
}

/* ---------- small screens ---------- */
@media (max-width: 760px) {
  .brand { top: 12px; left: 12px; right: auto; padding: 7px 12px 7px 8px; }
  .brand p { display: none; }
  .search { top: 64px; width: calc(100vw - 24px); height: 40px; }
  .search kbd { display: none; }
  .toolbar { top: 12px; right: 12px; }
  #settings { top: 116px; right: 12px; left: 12px; width: auto; }
  #legend { left: 12px; bottom: 12px; width: auto; max-width: calc(100vw - 24px); max-height: 40vh; }
  #legend.collapsed ul { display: none; }
  #legend .toggle-legend { display: inline; }
  #panel {
    top: auto;
    left: 0;
    right: 0;
    bottom: 0;
    width: auto;
    max-width: none;
    max-height: 62vh;
    border-radius: 18px 18px 0 0;
    padding-bottom: calc(22px + env(safe-area-inset-bottom));
    animation-name: sheet-in;
  }
  @keyframes sheet-in { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: none; } }
  #hint { display: none; }
  #timeline { bottom: 16px; }
}

@media (prefers-reduced-motion: reduce) {
  #panel { animation: none; }
}
</style>
</head>
<body>
<canvas id="sky" aria-label="Graph of your Claude Code context"></canvas>

<header class="brand glass">
  <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
    <defs>
      <radialGradient id="mk" cx="50%" cy="50%" r="50%">
        <stop offset="0" stop-color="#fff"/>
        <stop offset=".45" stop-color="#cdb8ff"/>
        <stop offset="1" stop-color="#7a5cff" stop-opacity="0"/>
      </radialGradient>
    </defs>
    <circle cx="16" cy="16" r="15" fill="url(#mk)" opacity=".55"/>
    <path d="M16 3.5 18.2 13.8 28.5 16 18.2 18.2 16 28.5 13.8 18.2 3.5 16 13.8 13.8Z" fill="#fff"/>
  </svg>
  <div class="brand-text">
    <h1>Constellation</h1>
    <p id="stats">Reading the sky…</p>
  </div>
</header>

<div class="search glass" role="search">
  <svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4.5 4.5"/></svg>
  <input id="q" type="text" placeholder="Search memory, skills, agents, hooks…" autocomplete="off" spellcheck="false" aria-label="Search">
  <kbd>/</kbd>
  <ul id="results" class="glass" role="listbox" hidden></ul>
</div>

<nav class="toolbar glass" aria-label="View">
  <button id="btn-fit" type="button" title="Fit to screen (F)" aria-label="Fit to screen">
    <svg viewBox="0 0 20 20"><path d="M3 7V3h4M13 3h4v4M17 13v4h-4M7 17H3v-4"/></svg>
  </button>
  <button id="btn-time" type="button" title="Time-lapse (T)" aria-label="Play time-lapse">
    <svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 6v4l2.5 2.5"/></svg>
  </button>
  <button id="btn-settings" type="button" title="Forces and filters" aria-label="Forces and filters" aria-expanded="false">
    <svg viewBox="0 0 20 20"><path d="M3 5h8M15 5h2M3 15h2M9 15h8M3 10h4M11 10h6"/><circle cx="13" cy="5" r="2"/><circle cx="7" cy="15" r="2"/><circle cx="9" cy="10" r="2"/></svg>
  </button>
</nav>

<section id="settings" class="glass" hidden aria-label="Forces and filters">
  <h3>Forces</h3>
  <label class="slider"><span>Repel</span><input type="range" id="s-repel" min="10" max="400" step="5"><output></output></label>
  <label class="slider"><span>Link distance</span><input type="range" id="s-linkDist" min="8" max="200" step="2"><output></output></label>
  <label class="slider"><span>Link strength</span><input type="range" id="s-linkStrength" min="0.05" max="2" step="0.05"><output></output></label>
  <label class="slider"><span>Center pull</span><input type="range" id="s-center" min="0" max="0.2" step="0.005"><output></output></label>
  <h3>Show</h3>
  <label class="switch"><input type="checkbox" id="t-showLabels"><i></i><span>Labels</span></label>
  <label class="switch"><input type="checkbox" id="t-showContains"><i></i><span>Structure lines</span></label>
  <label class="switch"><input type="checkbox" id="t-showMentions"><i></i><span>Mentions</span></label>
  <label class="switch"><input type="checkbox" id="t-showGhosts"><i></i><span>Unwritten links</span></label>
  <label class="switch"><input type="checkbox" id="t-showOrphans"><i></i><span>Lone stars</span></label>
  <label class="switch"><input type="checkbox" id="t-particles"><i></i><span>Signal flow</span></label>
  <div class="row-buttons">
    <button type="button" id="btn-relayout">Shuffle layout</button>
    <button type="button" id="btn-reset">Reset</button>
  </div>
</section>

<aside id="legend" class="glass" aria-label="Legend"></aside>

<aside id="panel" class="glass" hidden aria-live="polite"></aside>

<div id="timeline" class="glass" hidden>
  <span id="time-label"></span>
  <div class="bar"><i></i></div>
</div>

<div id="tip" class="glass" hidden role="tooltip"></div>

        const a = 0.08 + rnd() * maxA;
        const tint = rnd();
        g.fillStyle = tint < 0.15 ? `rgba(180,200,255,${a})` : tint < 0.22 ? `rgba(255,214,190,${a})` : `rgba(255,255,255,${a})`;
        g.beginPath();
        g.arc(x, y, r, 0, TAU);
        g.fill();
      }
      return { canvas: c, size, pattern: ctx.createPattern(c, 'repeat') };
    };
    starTiles = [make(140, 7, 0.55, 0.35), make(40, 99, 0.9, 0.5)];
  }
  function drawStars() {
    if (!starTiles) buildStars();
    const speeds = [0.025, 0.07];
    starTiles.forEach((t, i) => {
      const ox = (-cam.x * cam.k * speeds[i] * dpr) % t.size;
      const oy = (-cam.y * cam.k * speeds[i] * dpr) % t.size;
      ctx.setTransform(1, 0, 0, 1, ox, oy);
      ctx.fillStyle = t.pattern;
      ctx.globalAlpha = 1;
      ctx.fillRect(-ox, -oy, canvas.width, canvas.height);
    });
  }

  // ------------------------------------------------------------------ highlight
  function focusNode() {
    return hover || selected;
  }
  function neighbors(n) {
    if (neighborCache.node === n) return neighborCache.set;
    const set = new Set([n]);
    for (const l of n.out) if (l.t.visible) set.add(l.t);
    for (const l of n.inn) if (l.s.visible) set.add(l.s);
    neighborCache = { node: n, set };
    return set;
  }
  function updateHighlights(now) {
    const f = focusNode();
    const nb = f ? neighbors(f) : null;
    let moving = false;
    for (let i = 0; i < visNodes.length; i++) {
      const n = visNodes[i];
      let target = 1;
      if (nb) target = nb.has(n) ? 1 : 0.1;
      else if (searchSet) target = searchSet.has(n) ? 1 : 0.1;
      const d = target - n.hl;
      if (Math.abs(d) > 0.004) {
        n.hl += d * 0.2;
        moving = true;
      } else n.hl = target;
      if (n.pop < 1) {
        if (!n.popAt || now >= n.popAt) n.pop = Math.min(1, n.pop + (1 - n.pop) * 0.12 + 0.004);
        moving = true;
      }
    }
    const ft = nb || searchSet ? 1 : 0;
    if (Math.abs(ft - focusAmt) > 0.004) {
      focusAmt += (ft - focusAmt) * 0.2;
      moving = true;
    } else focusAmt = ft;
    return moving;
  }

  // ------------------------------------------------------------------ render
  function render(now) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawStars();

    const k = cam.k;
    ctx.setTransform(dpr * k, 0, 0, dpr * k, dpr * (W / 2 - cam.x * k), dpr * (H / 2 - cam.y * k));
    const [vx0, vy0] = toWorld(-40, -40);
    const [vx1, vy1] = toWorld(W + 40, H + 40);
    const inView = (x, y, m) => x + m > vx0 && x - m < vx1 && y + m > vy0 && y - m < vy1;
    const lineScale = Math.pow(Math.min(Math.max(k, 0.35), 2.5), 0.5) / k;

    const f = focusNode();

    // nebulae: a soft haze behind each cluster, in its main color
    ctx.globalCompositeOperation = 'lighter';
    for (const c of clusters) {
      if (!c.hub.visible) continue;
      let cx = 0;
      let cy = 0;
      let cnt = 0;
      let pop = 0;
      for (const m of c.members) {
        if (!m.visible) continue;
        cx += m.x;
        cy += m.y;
        pop += m.pop;
        cnt++;
      }
      if (cnt < 4) continue;
      cx /= cnt;
      cy /= cnt;
      let spread = 0;
      for (const m of c.members) if (m.visible) spread += (m.x - cx) ** 2 + (m.y - cy) ** 2;
      const R = Math.sqrt(spread / cnt) * 1.55 + 40;
      if (!inView(cx, cy, R)) continue;
      const near = c.hub === f || (f && c.members.includes(f));
      ctx.globalAlpha = Math.min(0.2, 0.05 + cnt / 900) * (pop / cnt) * (near ? 1.4 : 1 - 0.7 * focusAmt);
      ctx.drawImage(haze(c.color), cx - R, cy - R, R * 2, R * 2);
    }
    ctx.globalCompositeOperation = 'source-over';

    // links, batched by kind and tint
    ctx.lineCap = 'round';
    const batches = new Map();
    for (let i = 0; i < visLinks.length; i++) {
      const l = visLinks[i];
      const { s, t } = l;
      if ((s.x < vx0 && t.x < vx0) || (s.x > vx1 && t.x > vx1) || (s.y < vy0 && t.y < vy0) || (s.y > vy1 && t.y > vy1)) continue;
      const key = l.kind + l.tint;
      let arr = batches.get(key);
      if (!arr) batches.set(key, (arr = []));
      arr.push(l);
    }
    const fade = 1 - 0.78 * focusAmt;
    for (const arr of batches.values()) {
      const st = LINK[arr[0].kind];
      ctx.beginPath();
      for (const l of arr) {
        ctx.moveTo(l.s.x, l.s.y);
        ctx.lineTo(l.t.x, l.t.y);
      }
      ctx.globalAlpha = st.a * 1.25 * fade;
      ctx.strokeStyle = arr[0].tint;
      ctx.lineWidth = st.w * lineScale;
      ctx.stroke();
    }

    // highlighted links around the focused node
    if (f && f.visible) {
      const fl = [];
      for (const l of f.out) if (l.t.visible) fl.push(l);
      for (const l of f.inn) if (l.s.visible) fl.push(l);
      for (const l of fl) {
        const other = l.s === f ? l.t : l.s;
        const g = ctx.createLinearGradient(l.s.x, l.s.y, l.t.x, l.t.y);
        g.addColorStop(0, hexA(l.s.color, 0.85));
        g.addColorStop(1, hexA(l.t.color, 0.85));
        ctx.globalAlpha = Math.max(focusAmt, 0.2) * Math.min(1, other.hl + 0.2);
        ctx.strokeStyle = g;
        ctx.lineWidth = 1.15 * lineScale * (l.kind === 'mention' ? 0.8 : 1);
        ctx.beginPath();
        ctx.moveTo(l.s.x, l.s.y);
        ctx.lineTo(l.t.x, l.t.y);
        ctx.stroke();
      }
      if (S.particles) {
        const time = now / 1000;
        ctx.globalCompositeOperation = 'lighter';
        for (const l of fl) {
          const dx = l.t.x - l.s.x;
          const dy = l.t.y - l.s.y;
          const len = Math.sqrt(dx * dx + dy * dy) || 1;
          const speed = 70 / len;
          const p = (time * speed + l.seed) % 1;
          const x = l.s.x + dx * p;
          const y = l.s.y + dy * p;
          ctx.globalAlpha = 0.9 * focusAmt * Math.sin(p * Math.PI);
          ctx.fillStyle = l.t.color;
          ctx.beginPath();
          ctx.arc(x, y, 1.7 / Math.sqrt(k), 0, TAU);
          ctx.fill();
        }
        ctx.globalCompositeOperation = 'source-over';
      }
    }

    // glows, added light
    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < visNodes.length; i++) {
      const n = visNodes[i];
      const r = n.r * (0.35 + 0.65 * n.pop);
      const R = r * (n.type === 'root' ? 6 : n.type === 'ghost' ? 2.2 : 3.6);
      if (!inView(n.x, n.y, R)) continue;
      const boost = n === f ? 1.6 : n.type === 'root' ? 1.3 : n.type === 'ghost' ? 0.35 : 1;
      ctx.globalAlpha = Math.min(1, n.hl * n.pop * 0.85 * boost);
      ctx.drawImage(glow(n.color), n.x - R, n.y - R, R * 2, R * 2);
    }
    ctx.globalCompositeOperation = 'source-over';

    // cores
    for (let i = 0; i < visNodes.length; i++) {
      const n = visNodes[i];
      const r = n.r * (0.35 + 0.65 * n.pop);
      if (!inView(n.x, n.y, r + 4)) continue;
      const a = n.hl * n.pop;
      ctx.globalAlpha = a;
      if (n.type === 'ghost') {
        ctx.strokeStyle = n.color;
        ctx.lineWidth = 1.1 / k;
        ctx.setLineDash([2.2 / k, 2.2 / k]);
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, TAU);
        ctx.stroke();
        ctx.setLineDash([]);
        continue;
      }
      if (n.type === 'group') {
        ctx.strokeStyle = n.color;
        ctx.lineWidth = 1.4 / k;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r, 0, TAU);
        ctx.stroke();
        ctx.fillStyle = n.color;
        ctx.beginPath();
        ctx.arc(n.x, n.y, Math.max(1.2, r * 0.28), 0, TAU);
        ctx.fill();
        continue;
      }
      ctx.fillStyle = n.color;
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, TAU);
      ctx.fill();
      if (n.type === 'root') {
        ctx.strokeStyle = '#ffffff';
        for (const [m, al] of [[1.9, 0.18], [2.9, 0.08]]) {
          ctx.globalAlpha = a * al;
          ctx.lineWidth = 1 / k;
          ctx.beginPath();
          ctx.arc(n.x, n.y, r * m, 0, TAU);
          ctx.stroke();
        }
      } else if (n.type === 'project') {
        ctx.globalAlpha = a * 0.45;
        ctx.strokeStyle = n.color;
        ctx.lineWidth = 1 / k;
        ctx.beginPath();
        ctx.arc(n.x, n.y, r + 3.2, 0, TAU);
        ctx.stroke();
      } else if (n.type === 'instructions' || n.type === 'index') {
        ctx.globalAlpha = a * 0.9;
        ctx.fillStyle = 'rgba(20,16,4,0.55)';
        ctx.beginPath();
        ctx.arc(n.x, n.y, r * 0.42, 0, TAU);
        ctx.fill();
      }
    }

    // focus rings
    for (const n of [selected, hover]) {
      if (!n || !n.visible) continue;
      const pulse = n === selected ? 1 + Math.sin(now / 420) * 0.08 : 1;
      ctx.globalAlpha = 0.9;
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.4 / k;
      ctx.beginPath();
      ctx.arc(n.x, n.y, (n.r + 3.5 / Math.sqrt(k)) * pulse, 0, TAU);
      ctx.stroke();
    }

    // labels: rank by importance, then place greedily so none overlap
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.lineJoin = 'round';
    const nb = f ? neighbors(f) : null;
    const cand = [];
    for (let i = 0; i < visNodes.length; i++) {
      const n = visNodes[i];
      const [sx, sy] = toScreen(n.x, n.y);
      if (sx < -150 || sx > W + 150 || sy < -40 || sy > H + 40) {
        n.lab = 0;
        continue;
      }
      const hub = n.type === 'root' || n.type === 'group';
      const size = n.r * k;
      let want;
      if (hub) want = 1;
      else if (n.type === 'project') want = clamp01((size - 1.6) / 2);
      else want = clamp01((size - 2.4) / 2.6);
      if (!S.showLabels && !hub) want = 0;
      let pri = (hub ? 1e5 : 0) + (n.type === 'project' || n.type === 'index' || n.type === 'instructions' ? 2e4 : 0) + size * 100 + n.deg;
      if (nb) {
        if (nb.has(n)) {
          want = 1;
          pri += 1e6;
        } else want = hub ? 0.35 : 0;
      } else if (searchSet) {
        if (searchSet.has(n)) {
          want = Math.max(want, searchSet.size <= 40 ? 1 : want);
          pri += 1e6;
        } else want = hub ? 0.35 : 0;
      }
      if (n === selected || n === f) {
        want = 1;
        pri += 1e7;
      }
      if (want < 0.02 && !(n.lab > 0.01)) {
        n.lab = 0;
        continue;
      }
      cand.push({ n, sx, sy, want, pri, hub });
    }
    cand.sort((a, b) => b.pri - a.pri);
    const grid = new Map();
    const CELL = 64;
    const cellsOf = (r, fn) => {
      for (let gx = Math.floor(r[0] / CELL); gx <= Math.floor(r[2] / CELL); gx++) {
        for (let gy = Math.floor(r[1] / CELL); gy <= Math.floor(r[3] / CELL); gy++) if (fn(gx + ',' + gy) === false) return false;
      }
      return true;
    };
    const fits = (r) =>
      cellsOf(r, (key) => {
        const list = grid.get(key);
        if (!list) return true;
        for (const o of list) if (r[0] < o[2] && r[2] > o[0] && r[1] < o[3] && r[3] > o[1]) return false;
        return true;
      });
    const claim = (r) =>
      cellsOf(r, (key) => {
        let list = grid.get(key);
        if (!list) grid.set(key, (list = []));
        list.push(r);
      });
    // the glass panels count as taken space, so no name hides under them
    for (const sel of ['.brand', '.search', '.toolbar', '#legend', '#panel', '#settings', '#timeline']) {
      const el = document.querySelector(sel);
      if (!el || el.hidden) continue;
      const b = el.getBoundingClientRect();
      if (b.width && b.height) claim([b.left - 4, b.top - 4, b.right + 4, b.bottom + 4]);
    }
    labelAnim = false;
    for (const c of cand) {
      const { n, sx, sy, hub } = c;
      const strong = n === f || n === selected;
      let text = n.label;
      if (text.length > 38) text = text.slice(0, 36) + '…';
      let font;
      let spacing = '0px';
      if (hub) {
        font = n.type === 'root' ? `650 13px ${FONT}` : `650 10.5px ${FONT}`;
        spacing = n.type === 'root' ? '0.04em' : '0.14em';
        if (n.type !== 'root') text = text.toUpperCase();
      } else font = `${strong ? 600 : 500} ${strong ? 12 : 11}px ${FONT}`;
      ctx.font = font;
      if ('letterSpacing' in ctx) ctx.letterSpacing = spacing;
      const key = font + spacing + text;
      if (n.twKey !== key) {
        n.tw = ctx.measureText(text).width;
        n.twKey = key;
      }
      const y = sy + n.r * k * (n.type === 'root' ? 1.9 : 1) + 5;
      const rect = [sx - n.tw / 2 - 3, y - 1, sx + n.tw / 2 + 3, y + (hub ? 13 : 14)];
      let target = c.want;
      if (target > 0.02) {
        if (fits(rect)) claim(rect);
        else target = 0;
      }
      const cur = n.lab || 0;
      const next = Math.abs(target - cur) < 0.02 ? target : cur + (target - cur) * (target > cur ? 0.22 : 0.3);
      n.lab = next;
      if (next !== target) labelAnim = true;
      const la = next * n.pop * (hub ? Math.max(n.hl, 0.3) : 1);
      if (la < 0.03) continue;
      ctx.globalAlpha = la;
      if (strong && !hub) {
        // a dark pill behind the focused name
        ctx.fillStyle = 'rgba(8,10,18,0.78)';
        roundRect(rect[0] - 3, rect[1] - 2, rect[2] - rect[0] + 6, rect[3] - rect[1] + 3, 7);
        ctx.fill();
        ctx.strokeStyle = hexA(n.color, 0.45);
        ctx.lineWidth = 1;
        ctx.stroke();
      } else {
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = 'rgba(4,5,10,0.85)';
        ctx.strokeText(text, sx, y);
      }
      ctx.fillStyle = hub ? (n.type === 'root' ? '#ffffff' : '#aab2c6') : strong ? '#ffffff' : '#d9dde8';
      ctx.fillText(text, sx, y);
    }
    if ('letterSpacing' in ctx) ctx.letterSpacing = '0px';
    ctx.globalAlpha = 1;
  }

  // ------------------------------------------------------------------ loop
  function frame(now) {
    requestAnimationFrame(frame);
    let active = false;

    if (timelapse.active) stepTimelapse(now);

    if (sim.alpha > sim.alphaMin || sim.alphaTarget > 0) {
      tick();
      active = true;
    }

    if (camAnim) {
      const p = Math.min(1, (now - camAnim.t0) / camAnim.ms);
      const e = 1 - Math.pow(1 - p, 3);
      const { from, to } = camAnim;
      const kk = Math.exp(Math.log(from.k) + (Math.log(to.k) - Math.log(from.k)) * e);
      cam.k = kk;
      cam.x = from.x + (to.x - from.x) * e;
      cam.y = from.y + (to.y - from.y) * e;
      if (p >= 1) camAnim = null;
      active = true;
    } else if (autoFit && (sim.alpha > 0.01 || timelapse.active)) {
      const t = fitTarget();
      const lerp = 0.07;
      cam.x += (t.x - cam.x) * lerp;
      cam.y += (t.y - cam.y) * lerp;
      cam.k = Math.exp(Math.log(cam.k) + (Math.log(t.k) - Math.log(cam.k)) * lerp);
      active = true;
    }

    if (zoomGoal) {
      const step = Math.pow(zoomGoal.k / cam.k, 0.26);
      zoomAt(zoomGoal.sx, zoomGoal.sy, step, true);
      if (Math.abs(Math.log(zoomGoal.k / cam.k)) < 0.003) zoomGoal = null;
      active = true;
    }

    if (updateHighlights(now)) active = true;
    if (labelAnim) active = true;
    if (focusNode() && S.particles) active = true;
    if (selected) active = true; // pulse ring

    if (active || needsRender) {
      render(now);
      needsRender = false;
    }
  }

  // ------------------------------------------------------------------ time-lapse
  function startTimelapse() {
    const times = nodes.map((n) => n.time).filter(Boolean).sort((a, b) => a - b);
    if (times.length < 3) return;
    focusDepth = 0;
    timelapse.active = true;
    timelapse.times = times;
    timelapse.t0 = performance.now();
    timelapse.cursor = times[0] - 1;
    timelapse.endAt = 0;
    for (const n of nodes) if (n.time) n.pop = 0;
    computeVisible();
    reheat(0.8);
    autoFit = true;
    $('#timeline').hidden = false;
    $('#btn-time').classList.add('on');
    hideHint();
  }
  function stopTimelapse() {
    timelapse.active = false;
    for (const n of nodes) n.pop = Math.max(n.pop, 0.01);
    computeVisible();
    reheat(0.2);
    $('#btn-time').classList.remove('on');
    setTimeout(() => {
      if (!timelapse.active) $('#timeline').hidden = true;
    }, 1600);
  }
  function stepTimelapse(now) {
    const { times } = timelapse;
    const p = Math.min(1, (now - timelapse.t0) / timelapse.dur);
    const e = p < 0.5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
    const idx = Math.min(times.length - 1, Math.floor(e * (times.length - 1)));
    const cursor = times[idx];
    if (cursor !== timelapse.cursor) {
      const prev = timelapse.cursor;
      timelapse.cursor = cursor;
      for (const n of nodes) {
        if (!n.time || n.time <= prev || n.time > cursor) continue;
        const anchor = [...n.inn.map((l) => l.s), ...n.out.map((l) => l.t)].find((m) => m.visible);
        if (anchor) {
          const a = hashFloat(n.id) * TAU;
          n.x = anchor.x + Math.cos(a) * 12;
          n.y = anchor.y + Math.sin(a) * 12;
          n.vx = n.vy = 0;
        }
        n.pop = 0;
      }
      computeVisible();
      sim.alpha = Math.max(sim.alpha, 0.35);
    }
    $('#time-label').textContent = new Date(cursor).toLocaleDateString(undefined, { year: 'numeric', month: 'long', day: 'numeric' });
    $('#timeline .bar i').style.width = `${(p * 100).toFixed(1)}%`;
    if (p >= 1) stopTimelapse();
  }

  // ------------------------------------------------------------------ picking + input
  function pick(sx, sy) {
    const [wx, wy] = toWorld(sx, sy);
    let best = null;
    let bestD = Infinity;
    const slack = 5 / cam.k;
    for (let i = 0; i < visNodes.length; i++) {
      const n = visNodes[i];
      const dx = n.x - wx;
      const dy = n.y - wy;
      const d = Math.sqrt(dx * dx + dy * dy);
      const reach = Math.max(n.r, 3 / cam.k) + slack;
      if (d < reach && d - n.r < bestD) {
        best = n;
        bestD = d - n.r;
      }
    }
    return best;
  }

  const pointers = new Map();
  let drag = null;
  const tip = $('#tip');
  let tipNode = null;
  function showTip(n, x, y) {
    if (tipNode !== n) {
      tipNode = n;
      const lines = [
        h('div', { class: 'tip-type', style: `--c:${n.color}` }, h('i', { class: 'dot', style: `--c:${n.color}` }), typeLabel(n)),
        h('div', { class: 'tip-label' }, n.label),
      ];
      if (n.desc) lines.push(h('div', { class: 'tip-desc' }, n.desc));
      lines.push(h('div', { class: 'tip-meta' }, `${n.deg} connection${n.deg === 1 ? '' : 's'}${n.project && n.type !== 'project' ? ' · ' + n.project : ''}`));
      tip.replaceChildren(...lines);
      tip.hidden = false;
    }
    const w = tip.offsetWidth;
    const hh = tip.offsetHeight;
    const left = x + 16 + w > innerWidth - 8 ? x - w - 16 : x + 16;
    const top = Math.min(innerHeight - hh - 8, Math.max(8, y + 22));
    tip.style.transform = `translate(${Math.round(left)}px, ${Math.round(top)}px)`;
  }
  function hideTip() {
    if (!tipNode) return;
    tipNode = null;
    tip.hidden = true;
  }

  canvas.addEventListener('pointerdown', (e) => {
    hideTip();
    canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
    closeFloating();
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      drag = { type: 'pinch', d0: Math.hypot(a.x - b.x, a.y - b.y) || 1, k0: cam.k };
      userTookCamera();
      return;
    }
    const hit = pick(e.offsetX, e.offsetY);
    if (hit) {
      drag = { type: 'node', node: hit, sx: e.offsetX, sy: e.offsetY, moved: false };
    } else {
      drag = { type: 'pan', sx: e.offsetX, sy: e.offsetY, cx: cam.x, cy: cam.y, moved: false };
    }
  });
  canvas.addEventListener('pointermove', (e) => {
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.offsetX, y: e.offsetY });
    if (drag && drag.type === 'pinch' && pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y) || 1;
      zoomAt((a.x + b.x) / 2, (a.y + b.y) / 2, (drag.k0 * (d / drag.d0)) / cam.k);
      return;
    }
    if (drag && drag.type === 'node') {
      if (!drag.moved && Math.hypot(e.offsetX - drag.sx, e.offsetY - drag.sy) > 3) {
        drag.moved = true;
        canvas.classList.add('dragging');
        sim.alphaTarget = 0.25;
        reheat(0.25);
        userTookCamera();
      }
      if (drag.moved) {
        const [wx, wy] = toWorld(e.offsetX, e.offsetY);
        drag.node.fx = wx;
        drag.node.fy = wy;
      }
      return;
    }
    if (drag && drag.type === 'pan') {
      const dx = e.offsetX - drag.sx;
      const dy = e.offsetY - drag.sy;
      if (!drag.moved && Math.hypot(dx, dy) > 3) {
        drag.moved = true;
        canvas.classList.add('dragging');
        userTookCamera();
        camAnim = null;
      }
      if (drag.moved) {
        cam.x = drag.cx - dx / cam.k;
        cam.y = drag.cy - dy / cam.k;
        needsRender = true;
      }
      return;
    }
    if (e.pointerType === 'mouse') {
      const hit = pick(e.offsetX, e.offsetY);
      if (hit !== hover) {
        hover = hit;
        canvas.classList.toggle('over-node', Boolean(hit));
        needsRender = true;
      }
      if (hit && hit !== selected) showTip(hit, e.clientX, e.clientY);
      else hideTip();
    }
  });
  const endPointer = (e) => {
    pointers.delete(e.pointerId);
    if (!drag) return;
    if (drag.type === 'pinch') {
      if (pointers.size === 0) drag = null;
      return;
    }
    if (drag.type === 'node') {
      drag.node.fx = null;
      drag.node.fy = null;
      sim.alphaTarget = 0;
      if (!drag.moved) select(drag.node);
    } else if (drag.type === 'pan' && !drag.moved && e.type === 'pointerup') {
      select(null);
    }
    canvas.classList.remove('dragging');
    drag = null;
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', endPointer);
  canvas.addEventListener('pointerleave', () => {
    hideTip();
    if (hover && !drag) {
      hover = null;
      canvas.classList.remove('over-node');
      needsRender = true;
    }
  });
  canvas.addEventListener(
    'wheel',
    (e) => {
      e.preventDefault();
      userTookCamera();
      hideTip();
      const unit = e.deltaMode === 1 ? 16 : 1;
      const factor = Math.exp(-e.deltaY * unit * (e.ctrlKey ? 0.01 : 0.0017));
      if (e.ctrlKey) {
        zoomAt(e.offsetX, e.offsetY, factor); // trackpad pinch: follow the fingers
      } else {
        const base = zoomGoal ? zoomGoal.k : cam.k;
        zoomGoal = { k: Math.max(0.03, Math.min(8, base * factor)), sx: e.offsetX, sy: e.offsetY };
      }
    },
    { passive: false },
  );
  canvas.addEventListener('dblclick', (e) => {
    if (!pick(e.offsetX, e.offsetY)) fit();
  });

  function fit() {
    autoFit = false;
    flyTo(fitTarget());
  }

  // ------------------------------------------------------------------ selection + panel
  function select(n, { fly = false } = {}) {
    selected = n;
    neighborCache.node = null;
    if (!n && focusDepth) {
      focusDepth = 0;
      computeVisible();
      reheat(0.3);
    }
    renderPanel(n);
    if (n && fly) {
      autoFit = false;
      flyTo({ x: n.x + panelWidth() / 2 / Math.max(cam.k, 1.2), y: n.y, k: Math.max(cam.k, 1.2) });
    }
    needsRender = true;
  }

  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs || {})) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style') el.setAttribute('style', v);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
    for (const kid of kids.flat(Infinity)) {
      if (kid == null || kid === false) continue;
      el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }

  function typeLabel(n) {
    if (n.type === 'memory') return n.sub ? `Memory · ${n.sub}` : 'Memory';
    const base = { instructions: 'Instructions', group: 'Group', root: 'Root', ghost: 'Unwritten link', script: 'Hook script', hook: 'Hook event', mcp: 'MCP server', index: 'Memory index' }[n.type];
    const name = base || (TYPE[n.type] ? TYPE[n.type].name.replace(/s$/, '') : n.type);
    return n.sub && n.type !== 'memory' ? `${name} · ${n.sub}` : name;
  }

  function renderPanel(n) {
    const panel = $('#panel');
    if (!n) {
      panel.hidden = true;
      panel.replaceChildren();
      return;
    }
    const kids = [];
    kids.push(h('button', { class: 'close', type: 'button', 'aria-label': 'Close', onclick: () => select(null) }, '×'));
    kids.push(h('span', { class: 'chip', style: `--c:${n.color}` }, h('i', { class: 'dot', style: `--c:${n.color}` }), typeLabel(n)));
    kids.push(h('h2', null, n.label));
    if (n.path) {
      const btn = h('button', { type: 'button', title: 'Copy path' }, 'copy');
      btn.addEventListener('click', () => {
        const done = () => {
          btn.textContent = 'copied';
          setTimeout(() => (btn.textContent = 'copy'), 1200);
        };
        if (navigator.clipboard) navigator.clipboard.writeText(n.path).then(done, () => {});
      });
      kids.push(h('div', { class: 'path' }, h('code', null, n.path), btn));
    }
    if (n.desc) kids.push(h('p', { class: 'desc' }, n.desc));

    const meta = { ...(n.meta || {}) };
    if (n.project && n.type !== 'index') meta.project = n.project;
    if (n.modified) meta.modified = fmtDate(n.modified);
    if (n.created && n.created !== n.modified) meta.created = fmtDate(n.created);
    if (n.bytes) meta.size = fmtBytes(n.bytes);
    meta.connections = String(n.deg);
    const rows = Object.entries(meta).filter(([, v]) => v != null && v !== '');
    if (rows.length) kids.push(h('dl', null, rows.map(([k, v]) => [h('dt', null, k), h('dd', null, String(v))])));

    kids.push(h('h4', null, 'Local graph'));
    const seg = h('div', { class: 'seg', role: 'group' });
    [['All', 0], ['1 hop', 1], ['2 hops', 2]].forEach(([label, d]) => {
      seg.append(
        h('button', {
          type: 'button',
          class: focusDepth === d ? 'on' : '',
          onclick: () => {
            focusDepth = d;
            computeVisible();
            reheat(0.6);
            renderPanel(n);
            autoFit = false;
            setTimeout(() => flyTo(fitTarget()), d ? 450 : 0);
          },
        }, label),
      );
    });
    kids.push(seg);

    const groups = new Map();
    for (const l of n.out) addConn(groups, OUT_WORD[l.kind], l.t, l.label);
    for (const l of n.inn) addConn(groups, IN_WORD[l.kind], l.s, l.label);
    for (const [word, list] of groups) {
      kids.push(h('h4', null, `${word} · ${list.length}`));
      const wrap = h('div', { class: 'conn' });
      list.sort((a, b) => b.node.deg - a.node.deg);
      list.slice(0, 40).forEach(({ node, label }) => {
        wrap.append(
          h('button', { type: 'button', title: node.path || node.label, onclick: () => select(node, { fly: true }) },
            h('i', { class: 'dot', style: `--c:${node.color}` }),
            h('span', null, node.label),
            label ? h('em', null, label) : null),
        );
      });
      if (list.length > 40) wrap.append(h('span', { class: 'more' }, `+${list.length - 40} more`));
      kids.push(wrap);
    }

    if (n.preview) {
      kids.push(h('h4', null, 'Preview'));
      const md = h('div', { class: 'md' });
      md.innerHTML = renderMarkdown(n.preview);
      md.addEventListener('click', (e) => {
        const el = e.target.closest('.wl');
        if (!el) return;
        const target = nameIndex.get(norm(el.dataset.name || ''));
        if (target) select(target, { fly: true });
      });
      kids.push(md);
    } else if (DATA.meta && DATA.meta.redacted && !['root', 'group'].includes(n.type)) {
      kids.push(h('p', { class: 'note' }, 'Content left out. This page was made with --redact.'));
    }
    panel.replaceChildren(...kids);
    panel.hidden = false;
    panel.scrollTop = 0;
  }

  function addConn(groups, word, node, label) {
    if (!groups.has(word)) groups.set(word, []);
    groups.get(word).push({ node, label });
  }

  function fmtDate(iso) {
    const d = new Date(iso);
    return isNaN(d) ? iso : d.toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }
  function fmtBytes(b) {
    return b < 1024 ? `${b} B` : b < 1048576 ? `${(b / 1024).toFixed(1)} KB` : `${(b / 1048576).toFixed(1)} MB`;
  }

  // Safe markdown: escape everything first, then add a few inline styles.
  function esc(s) {
    return s.replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
  }
  function inline(s) {
    let out = esc(s);
    out = out.replace(/`([^`]+)`/g, '<code>$1</code>');
    out = out.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    out = out.replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (m, name, alias) => {
      const known = nameIndex.has(norm(name.replace(/&#39;/g, "'")));
      return `<span class="wl${known ? '' : ' missing'}" data-name="${name}">${alias || name}</span>`;
    });
    out = out.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, '<span class="ml" title="$2">$1</span>');
    return out;
  }
  function renderMarkdown(src) {
    const lines = src.split('\n');
    const out = [];
    let inCode = false;
    let code = [];
    let list = false;
    let para = [];
    const flushPara = () => {
      if (para.length) out.push(`<p>${inline(para.join(' '))}</p>`);
      para = [];
    };
    const closeList = () => {
      if (list) out.push('</ul>');
      list = false;
    };
    for (const line of lines) {
      if (/^\s*```/.test(line)) {
        if (inCode) {
          out.push(`<pre>${esc(code.join('\n'))}</pre>`);
          code = [];
          inCode = false;
        } else {
          flushPara();
          closeList();
          inCode = true;
        }
        continue;
      }
      if (inCode) {
        code.push(line);
        continue;
      }
      const hm = line.match(/^(#{1,6})\s+(.*)$/);
      const lm = line.match(/^\s*(?:[-*+]|\d+\.)\s+(.*)$/);
      if (hm) {
        flushPara();
        closeList();
        out.push(`<h5>${inline(hm[2])}</h5>`);
      } else if (lm) {
        flushPara();
        if (!list) out.push('<ul>');
        list = true;
        out.push(`<li>${inline(lm[1])}</li>`);
      } else if (!line.trim()) {
        flushPara();
        closeList();
      } else {
        closeList();
        para.push(line.trim());
      }
    }
    if (inCode) out.push(`<pre>${esc(code.join('\n'))}</pre>`);
    flushPara();
    closeList();
    return out.join('');
  }

  // ------------------------------------------------------------------ search
  const q = $('#q');
  const results = $('#results');
  let resultList = [];
  let active = 0;
  function runSearch() {
    const v = q.value.trim().toLowerCase();
    if (!v) {
      searchSet = null;
      results.hidden = true;
      needsRender = true;
      return;
    }
    const scored = [];
    for (const n of nodes) {
      if (!n.visible) continue;
      const lbl = n.label.toLowerCase();
      let score = -1;
      if (lbl === v) score = 100;
      else if (lbl.startsWith(v)) score = 80;
      else if (lbl.includes(v)) score = 60;
      else if (n.haystack.includes(v)) score = 30;
      if (score >= 0) scored.push([score + Math.min(n.deg, 30) / 10, n]);
    }
    scored.sort((a, b) => b[0] - a[0]);
    searchSet = new Set(scored.map((s) => s[1]));
    resultList = scored.slice(0, 9).map((s) => s[1]);
    active = 0;
    drawResults();
    needsRender = true;
  }
  function drawResults() {
    results.replaceChildren();
    if (!resultList.length) {
      results.append(h('li', { class: 'none' }, 'No match'));
    } else {
      resultList.forEach((n, i) => {
        results.append(
          h('li', {
            role: 'option',
            'aria-selected': i === active ? 'true' : 'false',
            onmousedown: (e) => {
              e.preventDefault();
              choose(n);
            },
          },
          h('i', { class: 'dot', style: `--c:${n.color}` }),
          h('span', { class: 'r-label' }, n.label),
          h('span', { class: 'r-type' }, typeLabel(n))),
        );
      });
      const more = searchSet.size - resultList.length;
      if (more > 0) results.append(h('li', { class: 'none' }, `${more} more stars light up on the map`));
    }
    results.hidden = false;
  }
  function choose(n) {
    results.hidden = true;
    q.blur();
    select(n, { fly: true });
  }
  q.addEventListener('input', runSearch);
  q.addEventListener('focus', () => {
    if (q.value.trim()) runSearch();
  });
  q.addEventListener('blur', () => setTimeout(() => (results.hidden = true), 120));
  q.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!resultList.length) return;
      active = (active + (e.key === 'ArrowDown' ? 1 : -1) + resultList.length) % resultList.length;
      drawResults();
    } else if (e.key === 'Enter') {
      if (resultList[active]) choose(resultList[active]);
    } else if (e.key === 'Escape') {
      q.value = '';
      runSearch();
      q.blur();
    }
  });

  // ------------------------------------------------------------------ legend
  function renderLegend() {
    const counts = new Map();
    for (const n of nodes) counts.set(n.key, (counts.get(n.key) || 0) + 1);
    const keys = [...counts.keys()].sort((a, b) => (ORDER.indexOf(a) + 1 || 99) - (ORDER.indexOf(b) + 1 || 99));
    const legend = $('#legend');
    const anyHidden = keys.some((k) => S.hidden.has(k));
    const head = h('h3', null, 'Stars',
      anyHidden ? h('button', { type: 'button', onclick: () => { S.hidden.clear(); afterFilter(); } }, 'Show all') : null,
      h('button', {
        type: 'button',
        class: 'toggle-legend',
        onclick: (e) => {
          legend.classList.toggle('collapsed');
          e.currentTarget.textContent = legend.classList.contains('collapsed') ? 'Show' : 'Hide';
        },
      }, W < 760 && (!legend.dataset.init || legend.classList.contains('collapsed')) ? 'Show' : 'Hide'));
    const ul = h('ul');
    for (const k of keys) {
      if (k === 'root') continue;
      ul.append(
        h('li', null,
          h('button', {
            type: 'button',
            class: S.hidden.has(k) ? 'off' : '',
            title: 'Click to hide or show. Alt-click to show only this kind.',
            onclick: (e) => {
              if (e.altKey) {
                const only = keys.filter((x) => x !== k && x !== 'root' && x !== 'group');
                const already = only.every((x) => S.hidden.has(x)) && !S.hidden.has(k);
                S.hidden = new Set(already ? [] : only);
              } else if (S.hidden.has(k)) S.hidden.delete(k);
              else S.hidden.add(k);
              afterFilter();
            },
          },
          h('i', { class: 'dot', style: `--c:${colorOfKey(k)}` }),
          h('span', { class: 'l-name' }, nameOfKey(k)),
          h('span', { class: 'l-count' }, counts.get(k).toLocaleString()))),
      );
    }
    legend.replaceChildren(head, ul);
    if (W < 760 && !legend.dataset.init) {
      legend.classList.add('collapsed');
      legend.dataset.init = '1';
    }
  }
  function afterFilter() {
    saveSettings();
    computeVisible();
    reheat(0.5);
    renderLegend();
    if (searchSet) runSearch();
  }

  // ------------------------------------------------------------------ settings ui
  const settingsEl = $('#settings');
  const btnSettings = $('#btn-settings');
  function bindSettings() {
    for (const key of ['repel', 'linkDist', 'linkStrength', 'center']) {
      const input = $(`#s-${key}`);
      const out = input.parentElement.querySelector('output');
      input.value = S[key];
      out.textContent = S[key];
      input.addEventListener('input', () => {
        S[key] = Number(input.value);
        out.textContent = input.value;
        if (key === 'repel') computeVisible();
        reheat(0.5);
        saveSettings();
      });
    }
    for (const key of ['showLabels', 'showContains', 'showMentions', 'showGhosts', 'showOrphans', 'particles']) {
      const input = $(`#t-${key}`);
      input.checked = Boolean(S[key]);
      input.addEventListener('change', () => {
        S[key] = input.checked;
        saveSettings();
        if (key !== 'showLabels' && key !== 'particles') {
          computeVisible();
          reheat(0.5);
        }
        needsRender = true;
      });
    }
    btnSettings.addEventListener('click', () => {
      settingsEl.hidden = !settingsEl.hidden;
      btnSettings.setAttribute('aria-expanded', String(!settingsEl.hidden));
    });
    $('#btn-relayout').addEventListener('click', () => {
      seedLayout(Math.floor(Math.random() * 1000) + 1);
      sim.alpha = 1;
      autoFit = true;
      needsRender = true;
    });
    $('#btn-reset').addEventListener('click', () => {
      Object.assign(S, { ...DEFAULTS, hidden: new Set() });
      saveSettings();
      for (const key of ['repel', 'linkDist', 'linkStrength', 'center']) {
        $(`#s-${key}`).value = S[key];
        $(`#s-${key}`).parentElement.querySelector('output').textContent = S[key];
      }
      for (const key of ['showLabels', 'showContains', 'showMentions', 'showGhosts', 'showOrphans', 'particles']) $(`#t-${key}`).checked = S[key];
      afterFilter();
    });
    $('#btn-fit').addEventListener('click', fit);
    $('#btn-time').addEventListener('click', () => (timelapse.active ? stopTimelapse() : startTimelapse()));
  }
  function closeFloating() {
    if (!settingsEl.hidden) {
      settingsEl.hidden = true;
      btnSettings.setAttribute('aria-expanded', 'false');
    }
  }

  // ------------------------------------------------------------------ keys
  addEventListener('keydown', (e) => {
    const typing = document.activeElement && ['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName) && document.activeElement.type !== 'range' && document.activeElement.type !== 'checkbox';
    if (typing) return;
    if (e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey))) {
      e.preventDefault();
      q.focus();
      q.select();
    } else if (e.key === 'Escape') {
      if (!settingsEl.hidden) closeFloating();
      else select(null);
    } else if (e.key === 'f' || e.key === 'F') fit();
    else if (e.key === 't' || e.key === 'T') timelapse.active ? stopTimelapse() : startTimelapse();
  });

  // ------------------------------------------------------------------ hint
  let hintTimer = setTimeout(hideHint, 9000);
  function hideHint() {
    clearTimeout(hintTimer);
    $('#hint').classList.add('gone');
  }

  // ------------------------------------------------------------------ boot
  function resize() {
    W = innerWidth;
    H = innerHeight;
    const nd = Math.min(devicePixelRatio || 1, 2);
    if (nd !== dpr) starTiles = null;
    dpr = nd;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    needsRender = true;
  }
  addEventListener('resize', resize);

  function stats() {
    const m = DATA.meta || {};
    const c = m.counts || {};
    const parts = [
      `${nodes.length.toLocaleString()} stars`,
      `${links.length.toLocaleString()} links`,
    ];
    if (c.project) parts.push(`${c.project} projects`);
    if (m.sessions) parts.push(`${m.sessions.toLocaleString()} sessions`);
    if (m.generated) parts.push(fmtDate(m.generated));
    if (m.anonymized) parts.push('anonymized');
    else if (m.redacted) parts.push('redacted');
    $('#stats').textContent = parts.join(' · ');
  }

  resize();
  stats();
  if (!nodes.length) $('#empty').hidden = false;
  bindSettings();
  seedLayout();
  computeVisible();
  renderLegend();
  if (!reducedMotion) {
    // intro: stars light up in waves, from the center outward
    const t = performance.now();
    for (const n of nodes) {
      n.pop = 0;
      n.popAt = t + 150 + Math.min(n.depth ?? 6, 6) * 240 + hashFloat(n.id) * 520;
    }
  }
  const t0 = fitTarget();
  cam.x = t0.x;
  cam.y = t0.y;
  cam.k = t0.k * 1.6;
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
